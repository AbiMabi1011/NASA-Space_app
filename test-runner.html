<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FieldShift — Automated Verification & Live Test Runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e1411;
      --card-bg: #151e19;
      --border: #223328;
      --text: #e6eee8;
      --text-muted: #8ca393;
      --accent: #34d399;
      --accent-dim: rgba(52, 211, 153, 0.15);
      --red: #f87171;
      --red-dim: rgba(248, 113, 113, 0.15);
      --yellow: #fbbf24;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      line-height: 1.5;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-family: 'Manrope', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .controls {
      display: flex;
      gap: 12px;
    }
    button.run-btn {
      background: var(--accent);
      color: #0b1a12;
      border: 0;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    button.run-btn:hover { opacity: 0.9; }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      min-height: 700px;
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }
    .panel-title {
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: 600px;
      padding-right: 6px;
    }
    .test-card {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .test-card.passed { border-left: 4px solid var(--accent); }
    .test-card.failed { border-left: 4px solid var(--red); }
    .test-card.running { border-left: 4px solid var(--yellow); }
    .test-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-name {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .status-tag.pass { background: var(--accent-dim); color: var(--accent); }
    .status-tag.fail { background: var(--red-dim); color: var(--red); }
    .status-tag.wait { background: rgba(255,255,255,0.08); color: var(--text-muted); }
    .test-detail {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .test-error {
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--red-dim);
      color: var(--red);
      padding: 6px 8px;
      border-radius: 4px;
      margin-top: 4px;
    }
    .preview-container {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 600px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }
    .stats-bar {
      display: flex;
      gap: 20px;
      padding: 12px 16px;
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-val {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
    }
    .stat-val.passed { color: var(--accent); }
    .stat-val.failed { color: var(--red); }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>FieldShift <span class="badge">NASA SPACE APPS 2026 TEST RUNNER</span></h1>
      <p style="color:var(--text-muted); font-size:13px; margin-top:4px;">Automated in-browser test suite validating requirements from SUBMISSION_KIT.md & README.md</p>
    </div>
    <div class="controls">
      <button class="run-btn" id="runTestsBtn">▶ Run All Tests</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-label">Total Tests</span>
      <span class="stat-val" id="totalCount">10</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Passed</span>
      <span class="stat-val passed" id="passedCount">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Failed</span>
      <span class="stat-val failed" id="failedCount">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Status</span>
      <span class="stat-val" id="suiteStatus" style="color:var(--yellow)">IDLE</span>
    </div>
  </div>

  <div class="layout">
    <!-- Test List Panel -->
    <div class="panel">
      <div class="panel-title">
        <span>Test Cases & Verifications</span>
        <span id="timeElapsed" style="font-family:var(--font-mono); font-size:12px;">0.0s</span>
      </div>
      <div class="test-list" id="testList"></div>
    </div>

    <!-- Live Preview Panel -->
    <div class="panel">
      <div class="panel-title">
        <span>Live App Sandboxed Instance</span>
        <span style="font-size:11px; color:var(--text-muted);">iframe: index.html</span>
      </div>
      <div class="preview-container">
        <iframe id="appFrame" src="index.html"></iframe>
      </div>
    </div>
  </div>

  <script>
    const testCases = [
      {
        id: 'tc1',
        title: 'Document & App Shell Initialization',
        desc: 'Verifies index.html loads with all navigation, summary cards, and branding.',
        run: async (win, doc) => {
          if (!doc.querySelector('.app-shell')) throw new Error('App shell container missing');
          if (!doc.querySelector('.brand')) throw new Error('FieldShift branding mark missing');
          if (!doc.getElementById('locationName')) throw new Error('Location header missing');
        }
      },
      {
        id: 'tc2',
        title: 'Initial Jaffna Peninsula Coordinates (Scene 1)',
        desc: 'Validates that coordinates default to Jaffna (9.66° N, 80.02° E) with NASA POWER source label.',
        run: async (win, doc) => {
          const lat = doc.getElementById('latitude')?.value;
          const lon = doc.getElementById('longitude')?.value;
          const locText = doc.getElementById('locationName')?.textContent;
          if (Math.abs(Number(lat) - 9.66) > 0.01) throw new Error(`Latitude expected 9.66, got ${lat}`);
          if (Math.abs(Number(lon) - 80.02) > 0.01) throw new Error(`Longitude expected 80.02, got ${lon}`);
          if (!locText.includes('Jaffna')) throw new Error(`Location header should reference Jaffna Peninsula`);
        }
      },
      {
        id: 'tc3',
        title: 'NASA POWER API or Graceful Sample Fallback',
        desc: 'Verifies data status indicator properly displays "NASA POWER" or "SAMPLE DATA" without unhandled errors.',
        run: async (win, doc) => {
          const status = doc.getElementById('dataStatus');
          if (!status) throw new Error('Data status element missing');
          const text = status.textContent.trim();
          if (text !== 'NASA POWER' && text !== 'SAMPLE DATA' && text !== 'LOADING') {
            throw new Error(`Unexpected data status: ${text}`);
          }
        }
      },
      {
        id: 'tc4',
        title: 'Dynamic Priority Re-ranking (Scene 2)',
        desc: 'Tests interactive buttons: Save water, Build soil, Steady income reorder rotation ideas.',
        run: async (win, doc) => {
          const soilBtn = doc.querySelector('[data-priority="soil"]');
          const waterBtn = doc.querySelector('[data-priority="water"]');
          if (!soilBtn || !waterBtn) throw new Error('Priority buttons missing');

          waterBtn.click();
          await new Promise(r => setTimeout(r, 100));
          const waterFirst = doc.querySelector('.rotation-name')?.textContent;

          soilBtn.click();
          await new Promise(r => setTimeout(r, 100));
          const soilFirst = doc.querySelector('.rotation-name')?.textContent;

          if (!waterFirst || !soilFirst) throw new Error('Failed to retrieve rotation names');
          // Reset back to water
          waterBtn.click();
        }
      },
      {
        id: 'tc5',
        title: 'Maha Season Switch & Historical Variation (Scene 3)',
        desc: 'Toggles Maha season, validates seasonal rainfall recalculation and 75% median threshold indicator.',
        run: async (win, doc) => {
          const mahaBtn = doc.querySelector('[data-season="maha"]');
          const yalaBtn = doc.querySelector('[data-season="yala"]');
          if (!mahaBtn || !yalaBtn) throw new Error('Season toggle buttons missing');

          mahaBtn.click();
          await new Promise(r => setTimeout(r, 150));

          const title = doc.getElementById('historyTitle')?.textContent;
          if (!title || !title.includes('Maha')) throw new Error(`History title should reflect Maha season, got: ${title}`);

          const chart = doc.getElementById('seasonHistoryChart');
          if (!chart || !chart.querySelector('.history-bars')) throw new Error('Historical season bars missing');

          // Reset back to yala
          yalaBtn.click();
        }
      },
      {
        id: 'tc6',
        title: 'NASA GPM IMERG Independent Satellite Cross-Check',
        desc: 'Verifies GPM IMERG comparison element renders independently from Agroclimatology series.',
        run: async (win, doc) => {
          const gpmEl = doc.getElementById('gpmCheck');
          if (!gpmEl) throw new Error('#gpmCheck container missing');
          const text = gpmEl.textContent;
          if (!text.includes('NASA GPM IMERG CROSS-CHECK')) {
            throw new Error('GPM IMERG title missing in container');
          }
        }
      },
      {
        id: 'tc7',
        title: 'Water Access Constraint Sensitivity',
        desc: 'Switches water access between rainfed and reliable, verifying heuristic adjustment.',
        run: async (win, doc) => {
          const select = doc.getElementById('waterAccess');
          if (!select) throw new Error('Water access dropdown missing');
          select.value = 'reliable';
          select.dispatchEvent(new Event('change'));
          await new Promise(r => setTimeout(r, 100));

          const baseline = doc.getElementById('currentBaseline')?.textContent;
          if (!baseline.includes('Reliable irrigation')) throw new Error('Baseline failed to update water access');
          
          // Revert
          select.value = 'rainfed';
          select.dispatchEvent(new Event('change'));
        }
      },
      {
        id: 'tc8',
        title: 'Soil Profile & pH Slider Reactive Updating',
        desc: 'Adjusts soil texture and slider value, confirming live summary synchronization.',
        run: async (win, doc) => {
          const soilSelect = doc.getElementById('soilType');
          const phInput = doc.getElementById('soilPh');
          if (!soilSelect || !phInput) throw new Error('Soil controls missing');

          soilSelect.value = 'clay';
          soilSelect.dispatchEvent(new Event('change'));
          phInput.value = '7.2';
          phInput.dispatchEvent(new Event('input'));
          await new Promise(r => setTimeout(r, 100));

          const soilSum = doc.getElementById('soilSummary')?.textContent;
          const phSum = doc.getElementById('phSummary')?.textContent;
          if (!soilSum.includes('Clay loam')) throw new Error('Soil summary did not reflect Clay loam');
          if (!phSum.includes('7.2')) throw new Error('pH summary did not reflect 7.2');

          // Revert
          soilSelect.value = 'sandy';
          soilSelect.dispatchEvent(new Event('change'));
          phInput.value = '6.5';
          phInput.dispatchEvent(new Event('input'));
        }
      },
      {
        id: 'tc9',
        title: 'Field Decision Card Generation (Scene 4)',
        desc: 'Verifies that clicking Download Field Decision Card executes cleanly.',
        run: async (win, doc) => {
          const dlBtn = doc.getElementById('downloadFieldCard');
          if (!dlBtn) throw new Error('Download button missing');
          // Mock URL.createObjectURL to avoid actual file dialog popup during automated run
          let createdBlob = false;
          const origCreate = win.URL.createObjectURL;
          win.URL.createObjectURL = (blob) => {
            if (blob.type.includes('text/html')) createdBlob = true;
            return origCreate(blob);
          };
          dlBtn.click();
          win.URL.createObjectURL = origCreate;
          if (!createdBlob) throw new Error('Field decision card blob was not created');
        }
      },
      {
        id: 'tc10',
        title: 'Scientific Methodology Details & Disclaimers',
        desc: 'Verifies "How FieldShift uses NASA data" accordion and disclaimers are present.',
        run: async (win, doc) => {
          const details = doc.querySelector('.method-details');
          if (!details) throw new Error('Method details accordion missing');
          const summary = details.querySelector('summary')?.textContent;
          if (!summary.includes('How FieldShift uses NASA data')) throw new Error('Accordion summary text mismatch');

          const footer = doc.querySelector('footer')?.textContent;
          if (!footer.includes('NASA does not endorse')) throw new Error('Limitation disclaimer missing from footer');
        }
      }
    ];

    const testListEl = document.getElementById('testList');
    const totalCountEl = document.getElementById('totalCount');
    const passedCountEl = document.getElementById('passedCount');
    const failedCountEl = document.getElementById('failedCount');
    const suiteStatusEl = document.getElementById('suiteStatus');
    const timeElapsedEl = document.getElementById('timeElapsed');
    const iframe = document.getElementById('appFrame');

    function renderCards() {
      totalCountEl.textContent = testCases.length;
      testListEl.innerHTML = testCases.map(tc => `
        <div class="test-card" id="card-${tc.id}">
          <div class="test-header">
            <span class="test-name">${tc.title}</span>
            <span class="status-tag wait" id="tag-${tc.id}">QUEUED</span>
          </div>
          <div class="test-detail">${tc.desc}</div>
          <div class="test-error" id="err-${tc.id}" style="display:none;"></div>
        </div>
      `).join('');
    }

    async function runAllTests() {
      renderCards();
      suiteStatusEl.textContent = 'RUNNING';
      suiteStatusEl.style.color = 'var(--yellow)';
      let passed = 0;
      let failed = 0;
      const startTime = performance.now();

      const win = iframe.contentWindow;
      const doc = iframe.contentDocument || win.document;

      // Allow 500ms for app to finish initial setup
      await new Promise(r => setTimeout(r, 600));

      for (const tc of testCases) {
        const card = document.getElementById(`card-${tc.id}`);
        const tag = document.getElementById(`tag-${tc.id}`);
        const errEl = document.getElementById(`err-${tc.id}`);

        card.className = 'test-card running';
        tag.className = 'status-tag wait';
        tag.textContent = 'TESTING';

        try {
          await tc.run(win, doc);
          card.className = 'test-card passed';
          tag.className = 'status-tag pass';
          tag.textContent = 'PASSED';
          passed++;
        } catch (err) {
          card.className = 'test-card failed';
          tag.className = 'status-tag fail';
          tag.textContent = 'FAILED';
          errEl.style.display = 'block';
          errEl.textContent = err.message;
          failed++;
        }

        passedCountEl.textContent = passed;
        failedCountEl.textContent = failed;
        timeElapsedEl.textContent = ((performance.now() - startTime) / 1000).toFixed(2) + 's';
        await new Promise(r => setTimeout(r, 120));
      }

      if (failed === 0) {
        suiteStatusEl.textContent = 'ALL PASSED';
        suiteStatusEl.style.color = 'var(--accent)';
      } else {
        suiteStatusEl.textContent = `${failed} FAILED`;
        suiteStatusEl.style.color = 'var(--red)';
      }
    }

    renderCards();
    document.getElementById('runTestsBtn').addEventListener('click', runAllTests);

    // Auto-run once iframe loads
    iframe.addEventListener('load', () => {
      setTimeout(runAllTests, 500);
    });
  </script>
</body>
</html>
